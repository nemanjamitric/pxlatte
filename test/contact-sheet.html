<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>pxlatte contact sheet</title>
  <style>
    body { margin: 0; background: #e4e2dc; font: 11px/1.3 -apple-system, sans-serif; }
    h1 { font-size: 13px; padding: 10px; margin: 0; background: #111; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1px; background: #111; }
    figure { margin: 0; background: #fff; padding: 6px; }
    canvas { width: 100%; display: block; background: #f4f3f0; }
    figcaption { padding: 4px 2px 0; font-weight: 600; }
    .err { color: #e30613; }
    .t { color: #888; font-weight: 400; }
  </style>
</head>
<body>
  <h1 id="h">rendering…</h1>
  <div class="grid" id="grid"></div>
  <script type="module">
    import { EFFECTS, PRE_PARAMS, defaultsFor, render } from '/src/lib/engine.js';
    import { makeSampleImage } from '/src/sample.js';

    const q = new URLSearchParams(location.search);
    const mode = q.get('mode') || 'mono';
    const only = q.get('only');
    const size = +(q.get('size') || 420);

    const colors = {
      ink: '#14161c', paper: '#f4f3f0',
      shadow: '#0d1b3e', highlight: '#f2e4c9',
      palette: ['#1a1a1a', '#f4f3f0', '#ff4d3d', '#2b5fd9', '#ffd21e'],
    };
    const pre = { ...defaultsFor(PRE_PARAMS), maxSize: size };
    const img = makeSampleImage();
    const grid = document.getElementById('grid');
    const list = only ? EFFECTS.filter((e) => e.id === only) : EFFECTS;
    let fails = 0;

    for (const e of list) {
      const fig = document.createElement('figure');
      const cv = document.createElement('canvas');
      const cap = document.createElement('figcaption');
      fig.append(cv, cap);
      grid.append(fig);
      const t0 = performance.now();
      try {
        render(cv, img, { effect: e.id, params: defaultsFor(e.params), pre, colorMode: mode, colors });
        const ms = Math.round(performance.now() - t0);
        /* An all-one-colour result means the effect silently did nothing. */
        const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
        const seen = new Set();
        for (let i = 0; i < d.length; i += 4 * 977) seen.add(d[i] + ',' + d[i+1] + ',' + d[i+2]);
        const flat = seen.size < 2;
        cap.innerHTML = e.name + ' <span class="t">' + ms + 'ms · ' + seen.size + ' tones</span>'
          + (flat ? ' <span class="err">FLAT</span>' : '');
        if (flat) fails++;
      } catch (err) {
        cap.innerHTML = e.name + ' <span class="err">' + err.message + '</span>';
        console.error(e.id, err);
        fails++;
      }
      await new Promise((r) => setTimeout(r, 0));
    }
    document.getElementById('h').textContent =
      `mode=${mode} · ${list.length} effects · ${fails} suspect`;
    document.title = fails ? `FAIL ${fails}` : 'ok';
  </script>
</body>
</html>
